<!DOCTYPE html>
<html>
<head>
  <title>Login Form</title>
  <script src="https://ajax.googleapis.com/ajax/libs/angularjs/1.8.2/angular.min.js"></script>
</head>
<body ng-app="">
<h2>Login Form</h2>
<form name="loginForm">
Username:
  <input type="text" name="user" ng-model="user" required>
  <span ng-show="loginForm.user.$touched && loginForm.user.$invalid">
    Required
  </span>
  <br><br>
 Password:
  <input type="password" name="pass" ng-model="pass" required minlength="4">
  <span ng-show="loginForm.pass.$touched && loginForm.pass.$invalid">
    Min 4 characters
  </span>
  <br><br>
<button ng-disabled="loginForm.$invalid">Login</button>
</form>
</body>
</html>
